            text: "Landing pages y webs corporativas rápidas, cuidadas y fáciles de mantener."
          - icon: "Icono: aplicación web"
            title: "Aplicaciones web a medida"
            text: "Paneles, herramientas internas y productos completos con usuarios, pagos e integraciones."
          - icon: "Icono: frontend"
