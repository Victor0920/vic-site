        title: "Sobre mí"
        paragraphs:
          - "Me encanta crear, dibujar y las matemáticas, por eso estudié Ingeniería en Diseño Industrial. A los 20 años descubrí la programación y quedé profundamente enamorado de las posibilidades. Elegí un máster de Robótica para ver si era eso lo que de verdad estaba buscando. Y tanto que lo fue."
          - "Aproveché el confinamiento para aprender JavaScript, Angular y Node mientras trabajaba de diseñador gráfico, y en septiembre de 2020 comencé una nueva vida como desarrollador frontend. Hoy trabajo como full stack y, en mi tiempo libre, desarrollo proyectos para clientes."
          - "Para mí no hay mejor manera de seguir aprendiendo que realizar nuevos proyectos con tecnologías alternativas (no comunes). He comprobado por mí mismo que, en la mayoría de los casos, son mejores que las «estándar»."
          - "Me levanto cada día súper motivado, disfruto trabajando y aprendo cosas nuevas a diario. ¡Encantado! :)"
        image: "Imagen: espacio de trabajo o proyecto"

      services:
        title: "Qué puedo hacer por ti"
        intro: "Estoy abierto a proyectos acotados que pueda desarrollar una sola persona: desde aplicaciones web complejas con múltiples integraciones hasta sencillas páginas web."
